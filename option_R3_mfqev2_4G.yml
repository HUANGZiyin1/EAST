dataset:
  train:  # LMDB
    type: MFQEv2Dataset
    
    # for lmdb
    root: data/
    gt_folder: train/raw/
    lq_folder: train/QP22/
    
    # for dataset
    gt_path: scc_LD_STDFgt22.lmdb
    lq_path: scc_LD_STDFlq22.lmdb
    meta_info_fp: meta_info.txt
    gt_size: 128  # ground truth patch size: gt_size * gt_size
    use_flip: True
    use_rot: True  # rotation per 90 degrees
    random_reverse: False

    # for datasampler
    enlarge_ratio: 300  # enlarge dataset by randomly cropping.
    
    # for dataloader
    num_worker_per_gpu: 6  # 12 in total. mainly affect IO speed
    batch_size_per_gpu: 16
  
  val:  # Disk IO
    type: VideoTestMFQEv2Dataset
    #root: D:/Lowdelayyuv
    gt_path: eval/raw
    lq_path: eval/QP22
    #meta_info_fp: meta_info.txt
    #enlarge_ratio: 1
    #use_flip: False
    #use_rot: False
    #random_reverse: False

  test:
    type: VideoTestMFQEv2Dataset
    gt_path: test/raw
    lq_path: test/QP22

network:
  radius: 3  # total num of input frame = 2 * radius + 1


train:
  exp_name: EAST_QP22_train  # default: timestr. None: ~
  random_seed: 7
  pre-val: True  # evaluate criterion before training, e.g., ori PSNR
  num_iter: !!float 3e+5
  interval_print: !!float 100
  interval_val: !!float 5e+3  # also save model
  pbar_len: 100

  optim:
    type: Adam
    lr: !!float 1e-4  # init lr of scheduler
    betas: [0.9, 0.999]
    eps: !!float 1e-08

  scheduler:
    is_on: False
    type: CosineAnnealingRestartLR
    periods: [!!float 5e+4, !!float 5e+4, !!float 5e+4, !!float 5e+4, !!float 5e+4, !!float 5e+4]  # epoch interval
    restart_weights: [1, 0.5, 0.5, 0.5, 0.5, 0.5]
    eta_min: !!float 1e-7

  loss:
    type: CharbonnierLoss
    eps: !!float 1e-6

  criterion:
    type: PSNR
    unit: dB

test:
  restore_iter: !!float 300000
  pbar_len: 100

  criterion:
    type: PSNR
    unit: dB
